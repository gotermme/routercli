# This YAML file defines every Command Level in this CLI's Tree Structure

trees:
  base:
    tree_file: var/tree/level_base.yaml
    is_base: true
    # No parent, no enter_command. Every session starts here, and
    # there is nowhere "before" it.

  exec:
    tree_file: var/tree/level_exec.yaml
    parent: base
    inherit_parent: true
    enter_command: enable
    exit_command: disable

  diagnostic:
    tree_file: var/tree/level_diagnostic.yaml
    parent: exec
    inherit_parent: false
    enter_command: diagnostic-mode
    exit_command: exit-diagnostic-mode

  config:
    tree_file: var/tree/level_config.yaml
    parent: exec
    inherit_parent: true
    prompt_suffix: "(config)"
    enter_command: configure.terminal
    # No exit_command. This level is left through the generic "exit"
    # and "end" commands (cmd/core/cmd_mode_control.go), not a
    # dedicated named command.

  config-if:
    tree_file: var/tree/level_config_if.yaml
    parent: config
    inherit_parent: true
    prompt_suffix: "(config-if)"
    enter_command: interface
    # No exit_command, same reasoning as config above. Also note that
    # "interface <name>" takes an argument, the interface name itself,
    # that cmd/product/cmd_interface.go stashes on the pushed
    # ModeFrame.Context. This manifest deliberately knows nothing
    # about that, only the bare command name.

  user:
    tree_file: var/tree/level_user.yaml
    parent: base
    inherit_parent: false
    prompt_suffix: "(user)"
    enter_command: user
    # No exit_command, same reasoning as config above. Reached
    # directly from base, not from exec, since managing one's own
    # account, multi-factor enrollment and a password change alike,
    # only requires being logged in, see cmd/core/cmd_user.go, not the
    # separate, unrelated privilege step "enable" gates.

  admin:
    tree_file: var/tree/level_admin.yaml
    parent: exec
    inherit_parent: false
    prompt_suffix: "(admin)"
    enter_command: admin
    exit_command: return.admin
    # This level replaces what used to be a separate level named
    # su-config. Its own "show running-config", "show startup-config",
    # "copy running-config startup-config", and "erase startup-config"
    # commands, and both properties below, moved here unchanged; see
    # var/tree/README.md's own admin section for the full reasoning,
    # including why an account administrator needs exactly the same
    # visibility su-config existed to provide.
    #
    # allowed_roles gates entry to this level to whichever role in
    # var/tree/roles.yaml is marked bypass: true, so only a
    # deployment's own seeded bootstrap account can reach it out of
    # the box. See RoleSet.BypassRole and var/tree/roles.yaml.
    #
    # grants_replay_trust: a real, live credential check succeeding
    # here, whether or not a password was ever configured, in
    # addition to the role check above, is what SuConfigTrustWindow,
    # in etc/routercli.yaml, measures from. reveal_vendor_defined_secrets
    # is what lets "show running-config" show a real vendor defined
    # hash here instead of the "<HIDDEN>" placeholder it shows
    # everywhere else.
    allowed_roles: [admin]
    grants_replay_trust: true
    reveal_vendor_defined_secrets: true
