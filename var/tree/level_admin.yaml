# This YAML file contains the commands for the "admin" Command Level,
# reached from the "exec" level with "admin", gated by allowed_roles in
# tree_structure.yaml to whichever role in var/tree/roles.yaml is marked
# bypass: true. See var/tree/README.md's own admin section.
#
# This level replaces what used to be a separate level named su-config.
# Its "show running-config", "show startup-config", "copy running-config
# startup-config", and "erase startup-config" commands moved here
# unchanged, still registered by cmd/product/cmd_startup_config.go and
# cmd/product/cmd_show.go, reused exactly as they already were. Every
# other command below is new, registered by cmd/core/cmd_admin.go.

commands:
  show:
    desc_key: show.desc
    subcommands:
      running-config:
        desc_key: show.running_config.desc
        pageable: true
        run: show.running-config
      startup-config:
        desc_key: show.startup_config.desc
        pageable: true
        run: show.startup-config

  copy:
    desc_key: copy.desc
    subcommands:
      running-config:
        desc_key: copy.running_config.desc
        subcommands:
          startup-config:
            desc_key: copy.running_config.startup_config.desc
            run: copy.running-config.startup-config

  erase:
    desc_key: erase.desc
    subcommands:
      startup-config:
        desc_key: erase.startup_config.desc
        run: erase.startup-config
      users:
        desc_key: erase.users.desc
        # Replaces the live users.yaml with a fresh copy of
        # DefaultsDir's own skeleton, never a plain delete, see
        # cmd/core/cmd_admin.go's own doc comment for why an empty
        # user database would permanently lock every account, admin
        # role included, out of this level.
        run: erase.users

  restore-factory-defaults:
    desc_key: restore_factory_defaults.desc
    # Erases startup-config, users.yaml, and roles.yaml, restores each
    # from DefaultsDir, and then reloads. See cmd/core/cmd_admin.go.
    run: restore-factory-defaults

  reload:
    desc_key: reload.desc
    # Re-reads every persistent file from disk, rebuilds this
    # session's own in-memory state from them, and ends the
    # connection. See cmd/core/cmd_admin.go's own doc comment for why
    # this cannot affect any other already connected session today.
    run: reload

  account:
    desc_key: account.desc
    subcommands:
      create:
        desc_key: account.create.desc
        arghelp_key: account.create.arghelp
        # Takes one to three tokens: the new username alone, prompting
        # interactively for its first password; the username followed
        # by the literal word "generate", auto-generating a password
        # meeting this deployment's own configured PasswordPolicy; or
        # the username followed by the literal word "hash" and an
        # already-computed hash value, imported directly with no
        # password ever typed. See cmd/core/cmd_admin.go's own doc
        # comment for the full reasoning, including why only the first
        # two of these three shapes set MustChangePassword.
        minargs: 1
        maxargs: 3
        maxarglength: 128
        run: account.create
      delete:
        desc_key: account.delete.desc
        arghelp_key: account.delete.arghelp
        minargs: 1
        maxargs: 1
        maxarglength: 64
        # Refuses to remove the last account holding the bypass role,
        # see cmd/core/cmd_admin.go.
        run: account.delete
      roles:
        desc_key: account.roles.desc
        subcommands:
          add:
            desc_key: account.roles.add.desc
            arghelp_key: account.roles.add.arghelp
            minargs: 2
            maxargs: 2
            maxarglength: 64
            run: account.roles.add
          remove:
            desc_key: account.roles.remove.desc
            arghelp_key: account.roles.remove.arghelp
            minargs: 2
            maxargs: 2
            maxarglength: 64
            run: account.roles.remove

  return:
    desc_key: return_admin.desc
    run: return.admin
